name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: make lint test
      - run: npx --prefix web playwright install --with-deps chromium
      - run: make e2e
      - run: make real-sources
      - run: make setup && docker compose up --build -d --wait
      - run: curl --fail http://localhost:8080/readyz
      - name: Clean up application
        if: always()
        run: |
          if [ -f .env ]; then
            docker compose down
          fi
      - name: Clean up test database
        if: always()
        run: docker compose -f compose.test.yaml down
