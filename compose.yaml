name: sherlock
services:
  app:
    build: .
    init: true
    environment:
      DATABASE_URL: postgres://sherlock:${POSTGRES_PASSWORD:?Run make setup first}@postgres:5432/sherlock?sslmode=disable
      SHERLOCK_ENCRYPTION_KEY: ${SHERLOCK_ENCRYPTION_KEY:?Run make setup first}
      SHERLOCK_SETUP_TOKEN: ${SHERLOCK_SETUP_TOKEN:?Run make setup first}
      SHERLOCK_ORIGIN: ${SHERLOCK_ORIGIN:-http://localhost:8080}
      SHERLOCK_ALLOWED_HOSTS: ${SHERLOCK_ALLOWED_HOSTS:-demo}
      SHERLOCK_ALLOWED_CIDRS: ${SHERLOCK_ALLOWED_CIDRS:-}
      SHERLOCK_NOTIFICATION_CIDRS: ${SHERLOCK_NOTIFICATION_CIDRS:-}
      SHERLOCK_NOTIFICATION_HOSTS: ${SHERLOCK_NOTIFICATION_HOSTS:-}
      SHERLOCK_NOTIFICATION_HTTP_HOSTS: ${SHERLOCK_NOTIFICATION_HTTP_HOSTS:-}
      SHERLOCK_DEMO_URL: http://demo:9000
      SHERLOCK_ADDR: 0.0.0.0:8080
      SHERLOCK_WEB_DIR: /app/web/dist
    ports:
      - "127.0.0.1:${SHERLOCK_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, --spider, -q, http://127.0.0.1:8080/readyz]
      interval: 5s
      timeout: 3s
      retries: 10
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  demo:
    build: .
    entrypoint: [sherlock-demo]
    profiles: [demo]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: sherlock
      POSTGRES_USER: sherlock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make setup first}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U sherlock -d sherlock]
      interval: 3s
      timeout: 3s
      retries: 15
    restart: unless-stopped
volumes:
  postgres-data:
