components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: sherlock_session }
  parameters:
    CSRF:
      {
        name: X-CSRF-Token,
        in: header,
        required: true,
        schema: { type: string },
      }
  responses:
    Error:
      description: Sanitized error
      content:
        application/json:
          schema:
            type: object
            required: [code, message, request_id]
            properties:
              code: { type: string }
              message: { type: string }
              request_id: { type: string }
  schemas:
    ConnectionInput:
      {
        "type": "object",
        "properties":
          {
            "name": { "type": "string" },
            "base_url": { "type": "string" },
            "username": { "type": "string" },
            "tenant": { "type": "string" },
            "ca_pem": { "type": "string" },
            "kind": { "type": "string", "enum": ["prometheus", "loki"] },
            "auth_mode":
              { "type": "string", "enum": ["none", "bearer", "basic"] },
            "secret":
              {
                "type": "string",
                "writeOnly": true,
                "description": "Omit/empty on edit to preserve credentials of the same auth mode.",
              },
          },
        "required": ["name", "kind", "base_url", "auth_mode"],
      }
    Connection:
      {
        "type": "object",
        "properties":
          {
            "id": { "type": "string" },
            "name": { "type": "string" },
            "kind": { "type": "string" },
            "base_url": { "type": "string" },
            "auth_mode": { "type": "string" },
            "tenant": { "type": "string" },
            "ca_pem": { "type": "string" },
            "origin": { "type": "string" },
            "status": { "type": "string" },
            "last_error": { "type": "string" },
            "enabled": { "type": "boolean" },
            "revision": { "type": "integer" },
            "last_test_at":
              { "type": ["string", "null"], "format": "date-time" },
            "last_success_at":
              { "type": ["string", "null"], "format": "date-time" },
            "capabilities": { "type": "array", "items": { "type": "string" } },
          },
      }
    Mapping:
      {
        "type": "object",
        "properties":
          {
            "prometheus_labels":
              {
                "type": "object",
                "additionalProperties": { "type": "string" },
                "description": "Exact metrics selector. Required when Prometheus is configured unless legacy labels are supplied.",
              },
            "loki_labels":
              {
                "type": "object",
                "additionalProperties": { "type": "string" },
                "description": "Exact logs selector. Required when Loki is configured unless legacy labels are supplied.",
              },
            "labels":
              {
                "type": "object",
                "additionalProperties": { "type": "string" },
              },
            "metric": { "type": "string" },
            "error_labels":
              {
                "type": ["object", "null"],
                "additionalProperties": { "type": "string" },
              },
            "error_pattern": { "type": "string" },
            "warning_pattern": { "type": "string" },
            "store_excerpts": { "type": "boolean" },
            "sensitive_patterns":
              { "type": "array", "items": { "type": "string" } },
          },
        "required":
          [
            "metric",
            "error_labels",
            "error_pattern",
            "warning_pattern",
            "store_excerpts",
          ],
      }
    ServiceInput:
      {
        "type": "object",
        "properties":
          {
            "name": { "type": "string" },
            "environment": { "type": "string" },
            "prometheus_id": { "type": "string" },
            "loki_id": { "type": "string" },
            "mapping": { "$ref": "#/components/schemas/Mapping" },
            "monitoring": { "type": "boolean" },
          },
        "required": ["name", "environment", "mapping"],
      }
    Service:
      {
        "type": "object",
        "properties":
          {
            "name": { "type": "string" },
            "environment": { "type": "string" },
            "prometheus_id": { "type": "string" },
            "loki_id": { "type": "string" },
            "mapping": { "$ref": "#/components/schemas/Mapping" },
            "monitoring": { "type": "boolean" },
            "id": { "type": "string" },
            "origin": { "type": "string", "enum": ["demo", "live"] },
            "revision": { "type": "integer" },
            "last_scan_id": { "type": "string" },
            "last_scan_state": { "type": "string" },
          },
      }
    Pattern:
      {
        "type": "object",
        "properties":
          {
            "fingerprint": { "type": "string" },
            "count": { "type": "integer" },
            "sample": { "type": "string" },
            "first": { "type": "string", "format": "date-time" },
            "last": { "type": "string", "format": "date-time" },
          },
      }
    Observation:
      {
        "type": "object",
        "properties":
          {
            "kind": { "type": "string" },
            "query": { "type": "string" },
            "start": { "type": "string", "format": "date-time" },
            "end": { "type": "string", "format": "date-time" },
            "complete": { "type": "boolean" },
            "sample_count": { "type": "integer" },
            "coverage_fraction": { "type": "number" },
            "value": { "type": "number" },
            "unit": { "type": "string" },
            "errors":
              {
                "type": "array",
                "items": { "$ref": "#/components/schemas/Pattern" },
              },
            "warnings":
              {
                "type": "array",
                "items": { "$ref": "#/components/schemas/Pattern" },
              },
            "notes": { "type": "string" },
            "redaction_version": { "type": "string" },
          },
      }
    Evidence:
      {
        "type": "object",
        "properties":
          {
            "id": { "type": "string" },
            "service_id": { "type": "string" },
            "connection_id": { "type": "string" },
            "origin": { "type": "string" },
            "source_available": { "type": "boolean" },
            "mapping_revision": { "type": "integer" },
            "collected_at": { "type": "string", "format": "date-time" },
            "expires_at": { "type": "string", "format": "date-time" },
            "observation": { "$ref": "#/components/schemas/Observation" },
          },
      }
    Settings:
      {
        "type": "object",
        "properties":
          {
            "cadence_minutes":
              { "type": "number", "minimum": 5, "maximum": 60 },
            "current_minutes":
              { "type": "number", "minimum": 5, "maximum": 60 },
            "baseline_minutes":
              { "type": "number", "minimum": 15, "maximum": 115 },
            "retention_days": { "type": "number", "minimum": 1, "maximum": 30 },
            "cooldown_hours":
              { "type": "number", "minimum": 1, "maximum": 168 },
            "min_occurrences":
              { "type": "number", "minimum": 2, "maximum": 1000 },
            "min_warnings": { "type": "number", "minimum": 3, "maximum": 1000 },
            "warning_multiplier":
              { "type": "number", "minimum": 2, "maximum": 100 },
            "min_traffic":
              { "type": "number", "minimum": 20, "maximum": 1000000000.0 },
            "error_delta": { "type": "number", "minimum": 0.001, "maximum": 1 },
            "error_multiplier":
              { "type": "number", "minimum": 1.1, "maximum": 100 },
            "disabled":
              {
                "type": "array",
                "items":
                  {
                    "type": "string",
                    "enum": ["new_exception", "warning_burst", "error_rate"],
                  },
              },
          },
        "required":
          [
            "cadence_minutes",
            "current_minutes",
            "baseline_minutes",
            "retention_days",
            "cooldown_hours",
            "min_occurrences",
            "min_warnings",
            "warning_multiplier",
            "min_traffic",
            "error_delta",
            "error_multiplier",
            "disabled",
          ],
      }
    Candidate:
      {
        "type": "object",
        "properties":
          {
            "detector": { "type": "string" },
            "signal": { "type": "string" },
            "title": { "type": "string" },
            "description": { "type": "string" },
            "severity": { "type": "string" },
            "evidence_ids": { "type": "array", "items": { "type": "string" } },
            "current": { "type": "number" },
            "baseline": { "type": "number" },
            "thresholds": { "$ref": "#/components/schemas/Settings" },
          },
      }
    Coverage:
      {
        "type": "object",
        "properties":
          {
            "detector": { "type": "string" },
            "status": { "type": "string" },
            "reason": { "type": "string" },
          },
      }
    Report:
      {
        "type": "object",
        "properties":
          {
            "summary": { "type": "string" },
            "observations":
              {
                "type": "array",
                "items":
                  {
                    "type": "object",
                    "properties":
                      {
                        "text": { "type": "string" },
                        "evidence_ids":
                          { "type": "array", "items": { "type": "string" } },
                        "at": { "type": "string", "format": "date-time" },
                        "window":
                          {
                            "type": "string",
                            "enum": ["incident", "comparison"],
                          },
                      },
                  },
              },
            "unknowns": { "type": "array", "items": { "type": "string" } },
            "checks": { "type": "array", "items": { "type": "string" } },
            "adequate": { "type": "boolean" },
          },
      }
    RunResult:
      {
        "type": "object",
        "properties":
          {
            "analysis":
              {
