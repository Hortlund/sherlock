        "required": ["enabled", "daily_limit", "run_limit", "revision"],
      }
    AIProvider:
      {
        "type": "object",
        "additionalProperties": false,
        "properties":
          {
            "id": { "type": "string", "format": "uuid", "readOnly": true },
            "kind": { "type": "string", "enum": ["openai", "anthropic"] },
            "triage_model": { "type": "string", "maxLength": 120, "description": "Optional separate triage model; empty leaves triage unconfigured." },
            "triage_input_price": { "type": "integer", "minimum": 0, "maximum": 10000000000, "description": "Micro-USD per million tokens; positive when triage_model is configured." },
            "triage_output_price": { "type": "integer", "minimum": 0, "maximum": 10000000000 },
            "triage_capability": { "type": "string", "readOnly": true, "enum": ["untested", "ready", "failed"] },
            "model":
              {
                "type": "string",
                "maxLength": 120,
                "pattern": "^[a-zA-Z0-9][a-zA-Z0-9._:-]{0,119}$",
              },
            "revision": { "type": "integer" },
            "enabled": { "type": "boolean" },
            "services":
              {
                "type": "array",
                "items": { "type": "string", "format": "uuid" },
                "maxItems": 100,
                "description": "Explicit allowlist. Empty means none.",
              },
            "allow_demo": { "type": "boolean" },
            "allow_excerpts": { "type": "boolean" },
            "input_price":
              {
                "type": "integer",
                "minimum": 0,
                "description": "Micro-USD per million input tokens; positive when enabled.",
                "maximum": 10000000000,
              },
            "output_price":
              {
                "type": "integer",
                "minimum": 0,
                "description": "Micro-USD per million output tokens; positive when enabled.",
                "maximum": 10000000000,
              },
            "price_date":
              {
                "type": "string",
                "format": "date",
                "description": "Not later than today.",
              },
            "capability":
              {
                "type": "string",
                "readOnly": true,
                "enum": ["untested", "ready", "failed"],
              },
            "secret_set": { "type": "boolean", "readOnly": true },
          },
        "required": ["kind", "model", "price_date"],
      }
    AIProviderInput:
      {
        "type": "object",
        "additionalProperties": false,
        "properties":
          {
            "provider": { "$ref": "#/components/schemas/AIProvider" },
            "api_key":
              {
                "type": "string",
                "writeOnly": true,
                "maxLength": 1024,
                "description": "Required on create; blank on update keeps encrypted key. No CR/LF.",
              },
          },
        "required": ["provider"],
      }
    AISettings:
      {
        "type": "object",
        "additionalProperties": false,
        "properties":
          {
            "policy": { "$ref": "#/components/schemas/AIPolicy" },
            "providers":
              {
                "type": "array",
                "items": { "$ref": "#/components/schemas/AIProvider" },
              },
            "spent_today":
              {
                "type": "integer",
                "minimum": 0,
                "description": "Integer micro-USD",
              },
            "reserved":
              {
                "type": "integer",
                "minimum": 0,
                "description": "Integer micro-USD",
              },
            "input_limit": { "type": "integer" },
            "output_limit": { "type": "integer" },
            "prompt_version": { "type": "string" },
            "fixture": { "type": "boolean" },
          },
      }
    AIStart:
      {
        "type": "object",
        "additionalProperties": false,
        "properties":
          {
            "provider_id": { "type": "string", "format": "uuid" },
            "tools": {"type": "boolean", "default": false, "description": "Explicitly allow approved read-only collection in the original service/windows. Only investigation preview/start endpoints use this field."},
            "parent_ai_run_id": {"type": "string", "description": "Retained completed report in this investigation/provider for a follow-up. Empty for a new analysis."},
            "question": {"type": "string", "maxLength": 512, "description": "Follow-up only; 1–512 UTF-8 bytes, sanitized before storage/egress. Required with parent_ai_run_id."},
            "confirm":
              {
                "type": "boolean",
                "description": "Must be true for a paid request; not needed for preview.",
              },
            "preview_digest":
              {
                "type": "string",
                "description": "Required for analysis; must match current preview.",
              },
            "fresh":
              {
                "type": "boolean",
                "default": false,
                "description": "Bypass a completed saved success; active equivalents still reuse.",
              },
          },
      }
    AIAdmission:
      {
        "type": "object",
        "additionalProperties": false,
        "properties":
          {
            "id": { "type": "string", "format": "uuid" },
            "reused": { "type": "boolean" },
          },
        "required": ["id", "reused"],
      }
    AIPreview:
      {
        "type": "object",
        "additionalProperties": false,
        "properties":
          {
            "payload":
              {
                "type": "object",
                "description": "Exact provider wire JSON body, without authorization headers.",
              },
            "preview_digest": { "type": "string" },
            "provider_id": { "type": "string", "format": "uuid" },
            "model": { "type": "string" },
            "input_bound": { "type": "integer" },
            "output_limit": { "type": "integer" },
            "reservation":
              {
                "type": "integer",
                "minimum": 0,
                "description": "Integer micro-USD",
              },
            "expires_at": { "type": "string", "format": "date-time" },
            "sends_data": { "const": false },
          },
      }
    AIReport:
      {
        "type": "object",
        "additionalProperties": false,
        "properties":
          {
            "summary":
              {
                "type": "string",
                "maxLength": 2048,
                "description": "Validated nonempty; redacted and truncated to 512 UTF-8 bytes before persistence.",
              },
            "observations":
              {
                "type": "array",
                "items":
                  {
                    "type": "object",
                    "additionalProperties": false,
                    "properties":
                      {
                        "text":
                          {
                            "type": "string",
                            "maxLength": 2048,
                            "description": "Validated nonempty; redacted and truncated to 512 UTF-8 bytes before persistence.",
                          },
                        "evidence_ids":
                          {
                            "type": "array",
                            "items": { "type": "string" },
                            "maxItems": 12,
                            "minItems": 1,
                          },
                      },
                    "required": ["text", "evidence_ids"],
                  },
                "minItems": 1,
                "maxItems": 8,
              },
            "hypotheses":
              {
                "type": "array",
                "items":
                  {
                    "type": "object",
                    "additionalProperties": false,
                    "properties":
                      {
                        "text":
                          {
                            "type": "string",
                            "maxLength": 2048,
                            "description": "Validated nonempty; redacted and truncated to 512 UTF-8 bytes before persistence.",
                          },
                        "supporting_ids":
                          {
                            "type": "array",
                            "items": { "type": "string" },
                            "maxItems": 12,
                            "minItems": 1,
                          },
                        "contradicting_ids":
                          {
                            "type": "array",
                            "items": { "type": "string" },
                            "maxItems": 12,
                          },
                      },
                    "required": ["text", "supporting_ids", "contradicting_ids"],
                  },
                "maxItems": 4,
              },
            "unknowns":
              {
                "type": "array",
                "items":
                  {
                    "type": "string",
                    "maxLength": 2048,
                    "description": "Validated nonempty; redacted and truncated to 512 UTF-8 bytes before persistence.",
                  },
                "minItems": 1,
                "maxItems": 8,
              },
            "checks":
              {
                "type": "array",
                "items":
                  {
                    "type": "string",
                    "maxLength": 2048,
                    "description": "Validated nonempty; redacted and truncated to 512 UTF-8 bytes before persistence.",
                  },
                "maxItems": 8,
              },
          },
        "required":
          ["summary", "observations", "hypotheses", "unknowns", "checks"],
      }
    AIRun:
      {
        "type": "object",
        "additionalProperties": false,
        "properties":
          {
            "id": { "type": "string", "format": "uuid" },
            "provider_id": { "type": "string", "format": "uuid" },
            "investigation_id": { "type": "string" },
            "service_id": { "type": "string" },
            "deep": {"type":"boolean"},
            "tools": {"type":"boolean"},
            "parent_ai_run_id": {"type":"string"},
            "question": {"type":"string", "description":"Sanitized question, omitted content after expiry/deletion."},
            "telemetry_attempts": {"type":"integer", "minimum":0, "maximum":12},
            "purpose": { "enum": ["test", "analysis", "triage_test", "triage", "automatic"] },
            "model": { "type": "string" },
            "origin": { "enum": ["live", "demo"] },
            "state":
              {
                "enum":
                  [
                    "queued",
                    "analyzing",
                    "completed",
                    "fallback",
                    "failed",
                    "refused",
                    "truncated",
                    "cancelled",
                    "unknown",
                    "budget_exhausted",
                    "insufficient_evidence",
                  ],
              },
            "reason": { "type": "string" },
            "reserved":
              {
                "type": "integer",
                "minimum": 0,
                "description": "Integer micro-USD",
              },
            "charged":
              {
                "type": "integer",
                "minimum": 0,
                "description": "Integer micro-USD",
              },
            "accounting":
              { "enum": ["reserved", "unknown", "settled", "reconciled"] },
            "input_bound": { "type": "integer" },
            "output_limit": { "type": "integer" },
            "input_tokens": { "type": ["integer", "null"] },
            "output_tokens": { "type": ["integer", "null"] },
            "request_id": { "type": "string" },
            "created_at": { "type": "string", "format": "date-time" },
            "expires_at": { "type": "string", "format": "date-time" },
            "started_at": { "type": ["string", "null"], "format": "date-time" },
            "finished_at":
              { "type": ["string", "null"], "format": "date-time" },
            "report":
              {
                "anyOf":
                  [
                    { "$ref": "#/components/schemas/AIReport" },
                    { "$ref": "#/components/schemas/TriageDecision" },
                    { "type": "null" },
                  ],
              },
          },
      }

    AIStep:
      type: object
      required: [sequence, kind, state, reason, input_bound, output_limit, telemetry_limit, reserved, charged, accounting, evidence_ids]
      properties:
        sequence: {type: integer, minimum: 1, maximum: 13}
        kind: {type: string, enum: [provider, evidence, prometheus_counts, loki_patterns]}
        state: {type: string, enum: [queued, running, completed, failed, unknown, cancelled]}
        reason: {type: string}
        input_bound: {type: integer}
        output_limit: {type: integer}
        telemetry_limit: {type: integer}
        reserved: {type: integer, description: Micro-USD}
        charged: {type: integer, description: Micro-USD}
        accounting: {type: string, enum: [reserved, settled, unknown]}
        input_tokens: {type: [integer, 'null']}
        output_tokens: {type: [integer, 'null']}
        started_at: {type: [string, 'null'], format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
        evidence_ids: {type: array, items: {type: string}}
