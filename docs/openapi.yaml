openapi: 3.1.0
info:
  title: Sherlock API
  version: 0.2.0
  description: Mutations require application/json and the configured Origin. Authenticated mutations also require X-CSRF-Token from /me. HTTPS installations use the __Host-sherlock_session cookie instead of sherlock_session.
servers:
  - url: /
security:
  - session: []
paths:
  /healthz:
    get:
      security: []
      responses:
        "200": { description: Process is alive }
  /readyz:
    get:
      security: []
      responses:
        "200": { description: Database is reachable }
        "503": { description: Database unavailable }
  /api/v1/setup/status:
    get:
      security: []
      responses:
        "200":
          description: Initialization state; no credentials or user data
          content:
            application/json:
              schema:
                type: object
                required: [initialized]
                properties:
                  initialized: { type: boolean }
  /api/v1/setup/bootstrap:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [setup_token, workspace_name, email, password]
              properties:
                setup_token: { type: string, writeOnly: true }
                workspace_name: { type: string, minLength: 1, maxLength: 80 }
                email: { type: string, format: email }
                password:
                  {
                    type: string,
                    minLength: 12,
                    writeOnly: true,
                    description: At most 256 UTF-8 bytes,
                  }
      responses:
        "201":
          {
            description: Created workspace/admin and issued session cookie plus csrf_token,
          }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/auth/login:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string, writeOnly: true }
      responses:
        "200": { description: Issued session cookie and csrf_token }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/me:
    get:
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                type: object
                required: [user, workspace, csrf_token, expires_at]
                properties:
                  user:
                    type: object
                    required: [id, email]
                    properties:
                      id: { type: string, format: uuid }
                      email: { type: string }
                  workspace:
                    type: object
                    required: [id, name]
                    properties:
                      id: { type: string, format: uuid }
                      name: { type: string }
                  csrf_token: { type: string }
                  expires_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/auth/logout:
    post:
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "200": { description: Session revoked and cookie cleared }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/auth/password:
    post:
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password, new_password]
              properties:
                current_password: { type: string, writeOnly: true }
                new_password:
                  {
                    type: string,
                    minLength: 12,
                    writeOnly: true,
                    description: At most 256 UTF-8 bytes,
                  }
      responses:
        "200": { description: Password changed; all user sessions revoked }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
