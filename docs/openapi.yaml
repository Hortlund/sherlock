  /api/v1/inbound/alerts/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Receive a signed generic inbound alert
      description: Requires application/json, at most 16 KiB. X-Sherlock-Signature is v1= plus lowercase HMAC-SHA256 hex over the canonical Unix-seconds timestamp, a dot, and exact UTF-8 body bytes. Timestamps must be within five minutes. Session/Origin/CSRF are not required on this endpoint only. Exact-body retries return the same receipt; event ID conflicts return 409. Acceptance does not promise dispatch. Disabled bindings reject requests; Off and unselected services produce terminal skipped receipts. Payload cannot choose workspace, service, source, model, tools, queries, recipients or policy. Outbound Sherlock and native Alertmanager envelopes are rejected.
      security:
        - inboundSignature: []
      parameters:
        - { name: X-Sherlock-Timestamp, in: header, required: true, schema: { type: string, pattern: '^[0-9]+$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InboundAlert' }
      responses:
        '202':
          description: Durable receipt; duplicate IDs with identical exact body reuse it
          content:
            application/json:
              schema:
                type: object
                required: [id, reused]
                properties:
                  id: { type: string, format: uuid }
                  reused: { type: boolean }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429':
          description: Binding request limit exceeded
          headers:
            Retry-After: { schema: { type: integer }, description: Seconds to wait (60) }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/inbound/receipts:
    get:
      summary: List inbound receipt outcomes and investigation/AI links
      description: Newest first; 50 per page. Titles expire after 24 hours; operational receipts and dedup IDs after 30 days when no linked execution is active. External titles are untrusted context and never forwarded to the model. Reading history never starts processing.
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Receipt history
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/InboundReceipt' } }
                  next_cursor: { type: string }
        '401': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    inboundSignature: { type: apiKey, in: header, name: X-Sherlock-Signature, description: Timestamp-bound HMAC-SHA256 signature using the binding signing secret }
    session: { type: apiKey, in: cookie, name: sherlock_session }
  parameters:
    CSRF:
      {
        name: X-CSRF-Token,
        in: header,
        required: true,
        schema: { type: string },
      }
  responses:
    Error:
      description: Sanitized error
      content:
        application/json:
          schema:
            type: object
            required: [code, message, request_id]
            properties:
              code: { type: string }
              message: { type: string }
              request_id: { type: string }
  schemas:
    InboundBinding:
      type: object
      additionalProperties: false
      required: [service_id, name, origin, per_minute, daily_limit]
      properties:
        id: { type: string }
        service_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 100 }
        origin: { type: string, enum: [demo, live] }
        enabled: { type: boolean, default: false }
        revision: { type: integer, minimum: 0 }
        per_minute: { type: integer, minimum: 1, maximum: 60 }
        daily_limit: { type: integer, minimum: 1, maximum: 100 }
    InboundBindingInput:
      type: object
      additionalProperties: false
      required: [binding]
      properties:
        binding: { $ref: '#/components/schemas/InboundBinding' }
        signing_secret: { type: string, maxLength: 256, writeOnly: true, description: Required on creation; nonempty secrets must be 32–256 bytes without CR/LF. Blank preserves an existing secret. }
    InboundAlert:
      type: object
      additionalProperties: false
      required: [version, event_id, start, end]
      properties:
        version: { type: string, const: inbound-v1 }
        event_id: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$' }
        title: { type: string, maxLength: 512, description: Optional untrusted context, at most 512 UTF-8 bytes without NUL characters; redacted before persistence and excluded from model input }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time, description: No future times; at most seven days old. Incident duration 5–60 minutes, at most two hours with configured baseline. Unsupported windows return 422 without substitution. }
    InboundReceipt:
      type: object
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string }
        binding_id: { type: string, format: uuid }
        binding_name: { type: string }
        service_id: { type: string, format: uuid }
        state: { type: string, enum: [queued, collecting, collected, ai_queued, skipped, cancelled, failed] }
        reason: { type: string }
        created_at: { type: string, format: date-time }
        title: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        investigation_id: { type: string }
        investigation_state: { type: string }
        ai_run_id: { type: string }
        ai_state: { type: string }
        ai_reason: { type: string }
    AutomationPolicy:
      type: object
      required: [mode, services, allow_demo, cooldown_minutes, growth_multiplier, revision]
      properties:
        mode:
          type: string
          enum: ['off', triage_only, auto_investigate]
          description: Automatic investigations require explicit recurring consent and a tested provider. Off is the default.
        tools_enabled:
          type: boolean
          default: false
          description: Additional opt-in for bounded read-only tools, effective only with automatic mode and recurring consent.
        automatic_consent:
          type: boolean
          default: false
          description: Required true in auto_investigate mode; authorizes recurring bounded paid analysis of selected services.
        investigation_provider_id:
          type: string
          default: ""
          description: Tested investigation provider required in auto_investigate mode, subject to service consent and positive daily/per-run budgets and prices.
        triage_provider_id:
          type: string
          default: ""
          description: Empty disables AI triage. A provider ID explicitly opts into recurring calls after local recommendation gates, subject to tested triage capability, service consent and shared AI budgets.
        services:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
          description: Explicit workspace service selection; empty includes none.
        allow_demo: { type: boolean, default: false }
        cooldown_minutes: { type: integer, minimum: 5, maximum: 1440, default: 30 }
        growth_multiplier: { type: number, minimum: 1.5, maximum: 10, default: 2 }
        revision: { type: integer, minimum: 0, description: 'Current revision on write; stale saves return 409.' }
    AutomationMeasurement:
      type: object
      required: [value, unit, comparison_key, severity, minimum_delta]
      properties:
        value: { type: number, minimum: 0 }
        unit: { type: string, enum: [error_proportion, sampled_lines_per_minute] }
        comparison_key: { type: string }
        severity: { type: string }
        minimum_delta: { type: number, minimum: 0 }
    TriageDecision:
      type: object
      additionalProperties: false
      required: [decision, reason, evidence_ids]
      properties:
        decision: { type: string, enum: [investigate, observe, needs_attention, need_more_data] }
        reason: { type: string }
        evidence_ids:
          type: array
          minItems: 1
          maxItems: 12
          uniqueItems: true
          items: { type: string }
    TriageActivity:
      type: object
      properties:
        status: { type: string, description: 'off, queued, analyzing, cached, unavailable, or the terminal AI state' }
        reason: { type: string }
        run_id: { type: [string, 'null'] }
        model: { type: [string, 'null'] }
        provider: { type: [string, 'null'] }
        accounting: { type: [string, 'null'] }
        reserved: { type: [integer, 'null'], description: Micro-USD }
        charged: { type: [integer, 'null'], description: Micro-USD }
        report:
          anyOf:
            - { $ref: '#/components/schemas/TriageDecision' }
            - { type: 'null' }
    AutomationActivity:
      type: object
      required: [id, service_id, service_name, origin, state, reason, policy_revision, mapping_revision, created_at, due_at, evaluated_at, next_eligible_at, items]
      properties:
        admission:
          type: object
          properties:
            status: { type: string, enum: ['off', pending, skipped, launched] }
            reason: { type: string }
            ai_run_id: { type: [string, 'null'] }
            investigation_id: { type: [string, 'null'] }
            state: { type: [string, 'null'] }
            run_reason: { type: [string, 'null'] }
            model: { type: [string, 'null'] }
            accounting: { type: [string, 'null'] }
            reserved: { type: [integer, 'null'], description: Micro-USD }
            charged: { type: [integer, 'null'], description: Micro-USD }
        triage: { $ref: '#/components/schemas/TriageActivity' }
        id: { type: string, format: uuid }
        service_id: { type: string, format: uuid }
        service_name: { type: string }
        origin: { type: string, enum: [live, demo] }
        state: { type: string, enum: [pending, recommended, skipped] }
        reason: { type: string }
        policy_revision: { type: integer }
        mapping_revision: { type: integer }
        created_at: { type: string, format: date-time }
        due_at: { type: string, format: date-time }
        evaluated_at: { type: [string, 'null'], format: date-time }
        next_eligible_at: { type: [string, 'null'], format: date-time }
        items:
          type: array
          items:
            type: object
            required: [finding_id, title, trigger, recommendation, reason, measurement, observed_at]
            properties:
              finding_id: { type: string, format: uuid }
              title: { type: string }
              trigger: { type: string, enum: ['', new_occurrence, severity_changed, growth, comparison_changed] }
              recommendation: { type: string, enum: [pending, investigate, observe, need_more_data] }
              reason: { type: string }
              measurement: { $ref: '#/components/schemas/AutomationMeasurement' }
              observed_at: { type: string, format: date-time }
