    NotificationRules:
      type: object
      additionalProperties: false
      required: [events, origins, severities, timezone]
      properties:
        events:
          {
            type: array,
            minItems: 1,
            maxItems: 4,
            items:
              {
                type: string,
                enum:
                  [
                    finding.created,
                    finding.escalated,
                    finding.resolved,
                    investigation.completed,
                  ],
              },
          }
        services:
          {
            type: array,
            maxItems: 100,
            items: { type: string, format: uuid },
            description: Empty means all workspace services,
          }
        origins:
          {
            type: array,
            minItems: 1,
            maxItems: 2,
            items: { type: string, enum: [live, demo] },
          }
        severities:
          {
            type: array,
            minItems: 1,
            maxItems: 2,
            items: { type: string, enum: [notice, warning] },
          }
        immediate:
          {
            type: boolean,
            default: false,
            description: Bypass 60-second grouping; quiet hours still apply,
          }
        quiet_start:
          {
            type: string,
            description: HH:MM local time or empty; both times required and must differ,
          }
        quiet_end: { type: string }
        timezone:
          { type: string, description: IANA timezone such as Europe/Stockholm }
    NotificationDestinationInput:
      type: object
      additionalProperties: false
      required: [name, kind, rules]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        kind: { type: string, enum: [slack, discord, webhook] }
        enabled: { type: boolean, default: false }
        revision:
          {
            type: integer,
            description: Required on update; use the revision returned by GET,
          }
        rules: { $ref: "#/components/schemas/NotificationRules" }
        url:
          {
            type: string,
            writeOnly: true,
            maxLength: 2048,
            description: Required on create; HTTPS official Slack/Discord URL or generic receiver; explicit deployment exceptions permit generic HTTP,
          }
        signing_key:
          {
            type: string,
            writeOnly: true,
            maxLength: 256,
            description: Generic webhooks require 32–256 UTF-8 bytes; blank on edit preserves the stored secret,
          }
    NotificationDestination:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [slack, discord, webhook] }
        enabled: { type: boolean }
        revision: { type: integer }
        rules: { $ref: "#/components/schemas/NotificationRules" }
        secret_set: { type: boolean }
    NotificationDelivery:
      type: object
      properties:
        id: { type: string, format: uuid }
        destination_id: { type: string, format: uuid }
        destination_name: { type: string }
        state:
          {
            type: string,
            enum: [pending, sending, retrying, sent, failed, cancelled],
          }
        test: { type: boolean }
        attempts: { type: integer, minimum: 0, maximum: 8 }
        event_count: { type: integer }
        last_error:
          {
            type: string,
            description: Sanitized outcome; never includes receiver response or secret URL,
          }
        message_id:
          {
            type: string,
            description: Discord acknowledged message ID when available,
          }
        created_at: { type: string, format: date-time }
        due_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        history:
          type: array
          items:
            type: object
            properties:
              number: { type: integer }
              started_at: { type: string, format: date-time }
              finished_at: { type: [string, "null"], format: date-time }
              outcome:
                {
                  type: string,
                  enum: [unknown, acknowledged, rejected, retryable, cancelled],
                }
              status_code:
                {
                  type: integer,
                  description: Zero when no HTTP response was received,
                }
              detail: { type: string }

    AIPolicy:
      {
        "type": "object",
        "additionalProperties": false,
        "properties":
          {
            "enabled": { "type": "boolean" },
            "daily_limit":
              {
                "type": "integer",
                "minimum": 0,
                "description": "Integer micro-USD",
                "maximum": 1000000000,
              },
            "run_limit":
              {
                "type": "integer",
                "minimum": 0,
                "description": "Micro-USD; must not exceed daily_limit. Both limits positive when enabled.",
              },
            "revision":
              {
                "type": "integer",
                "description": "Use current revision from settings; 0 before first save.",
              },
          },
        "required": ["enabled", "daily_limit", "run_limit", "revision"],
      }
    AIProvider:
      {
        "type": "object",
        "additionalProperties": false,
        "properties":
          {
            "id": { "type": "string", "format": "uuid", "readOnly": true },
            "kind": { "type": "string", "enum": ["openai", "anthropic"] },
            "model":
              {
                "type": "string",
                "maxLength": 120,
                "pattern": "^[a-zA-Z0-9][a-zA-Z0-9._:-]{0,119}$",
              },
            "revision": { "type": "integer" },
            "enabled": { "type": "boolean" },
            "services":
              {
                "type": "array",
                "items": { "type": "string", "format": "uuid" },
                "maxItems": 100,
                "description": "Explicit allowlist. Empty means none.",
              },
            "allow_demo": { "type": "boolean" },
            "allow_excerpts": { "type": "boolean" },
            "input_price":
              {
                "type": "integer",
                "minimum": 0,
                "description": "Micro-USD per million input tokens; positive when enabled.",
                "maximum": 10000000000,
              },
            "output_price":
              {
                "type": "integer",
                "minimum": 0,
                "description": "Micro-USD per million output tokens; positive when enabled.",
                "maximum": 10000000000,
              },
            "price_date":
              {
                "type": "string",
                "format": "date",
                "description": "Not later than today.",
              },
            "capability":
              {
                "type": "string",
                "readOnly": true,
                "enum": ["untested", "ready", "failed"],
              },
            "secret_set": { "type": "boolean", "readOnly": true },
          },
        "required": ["kind", "model", "price_date"],
      }
    AIProviderInput:
      {
        "type": "object",
        "additionalProperties": false,
        "properties":
          {
            "provider": { "$ref": "#/components/schemas/AIProvider" },
            "api_key":
              {
                "type": "string",
                "writeOnly": true,
                "maxLength": 1024,
                "description": "Required on create; blank on update keeps encrypted key. No CR/LF.",
              },
          },
        "required": ["provider"],
      }
    AISettings:
      {
        "type": "object",
        "additionalProperties": false,
        "properties":
          {
            "policy": { "$ref": "#/components/schemas/AIPolicy" },
            "providers":
              {
                "type": "array",
                "items": { "$ref": "#/components/schemas/AIProvider" },
              },
            "spent_today":
              {
                "type": "integer",
                "minimum": 0,
                "description": "Integer micro-USD",
              },
            "reserved":
              {
                "type": "integer",
                "minimum": 0,
                "description": "Integer micro-USD",
              },
            "input_limit": { "type": "integer" },
            "output_limit": { "type": "integer" },
            "prompt_version": { "type": "string" },
            "fixture": { "type": "boolean" },
          },
      }
    AIStart:
      {
        "type": "object",
        "additionalProperties": false,
        "properties":
          {
            "provider_id": { "type": "string", "format": "uuid" },
