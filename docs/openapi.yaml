          },
        "required": ["id", "reused"],
      }
    AIPreview:
      {
        "type": "object",
        "additionalProperties": false,
        "properties":
          {
            "payload":
              {
                "type": "object",
                "description": "Exact provider wire JSON body, without authorization headers.",
              },
            "preview_digest": { "type": "string" },
            "provider_id": { "type": "string", "format": "uuid" },
            "model": { "type": "string" },
            "input_bound": { "type": "integer" },
            "output_limit": { "type": "integer" },
            "reservation":
              {
                "type": "integer",
                "minimum": 0,
                "description": "Integer micro-USD",
              },
            "expires_at": { "type": "string", "format": "date-time" },
            "sends_data": { "const": false },
          },
      }
    AIReport:
      {
        "type": "object",
        "additionalProperties": false,
        "properties":
          {
            "summary":
              {
                "type": "string",
                "maxLength": 2048,
                "description": "Validated nonempty; redacted and truncated to 512 UTF-8 bytes before persistence.",
              },
            "observations":
              {
                "type": "array",
                "items":
                  {
                    "type": "object",
                    "additionalProperties": false,
                    "properties":
                      {
                        "text":
                          {
                            "type": "string",
                            "maxLength": 2048,
                            "description": "Validated nonempty; redacted and truncated to 512 UTF-8 bytes before persistence.",
                          },
                        "evidence_ids":
                          {
                            "type": "array",
                            "items": { "type": "string" },
                            "maxItems": 12,
                            "minItems": 1,
                          },
                      },
                    "required": ["text", "evidence_ids"],
                  },
                "minItems": 1,
                "maxItems": 8,
              },
            "hypotheses":
              {
                "type": "array",
                "items":
                  {
                    "type": "object",
                    "additionalProperties": false,
                    "properties":
                      {
                        "text":
                          {
                            "type": "string",
                            "maxLength": 2048,
                            "description": "Validated nonempty; redacted and truncated to 512 UTF-8 bytes before persistence.",
                          },
                        "supporting_ids":
                          {
                            "type": "array",
                            "items": { "type": "string" },
                            "maxItems": 12,
                            "minItems": 1,
                          },
                        "contradicting_ids":
                          {
                            "type": "array",
                            "items": { "type": "string" },
                            "maxItems": 12,
                          },
                      },
                    "required": ["text", "supporting_ids", "contradicting_ids"],
                  },
                "maxItems": 4,
              },
            "unknowns":
              {
                "type": "array",
                "items":
                  {
                    "type": "string",
                    "maxLength": 2048,
                    "description": "Validated nonempty; redacted and truncated to 512 UTF-8 bytes before persistence.",
                  },
                "minItems": 1,
                "maxItems": 8,
              },
            "checks":
              {
                "type": "array",
                "items":
                  {
                    "type": "string",
                    "maxLength": 2048,
                    "description": "Validated nonempty; redacted and truncated to 512 UTF-8 bytes before persistence.",
                  },
                "maxItems": 8,
              },
          },
        "required":
          ["summary", "observations", "hypotheses", "unknowns", "checks"],
      }
    AIRun:
